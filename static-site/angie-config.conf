server {
    listen 80;
    server_name 2minutes.ru;
    
    # Редирект на HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name 2minutes.ru;
    
    # Автоматическое получение SSL сертификата
    acme prod;
    
    client_max_body_size 20M;
    
    ssl_certificate $acme_cert_prod.ru;
    ssl_certificate_key $acme_cert_key_prod.ru;
    
    status_zone 2minutes.ru;
    
    # Корневая директория со статическими файлами
    root /var/www/2minutes.ru;
    index index.html;
    
    # Логи
    access_log /var/log/angie/2minutes.ru.access.log;
    error_log /var/log/angie/2minutes.ru.error.log;
    
    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    
    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Основная локация - статические HTML файлы
    location / {
        try_files $uri $uri/ =404;
        status_zone default;
    }
    
    # Кеширование статических ресурсов (CSS, JS, изображения, видео)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm|MP4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        status_zone static_files;
    }
    
    # Кеширование для assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        status_zone assets;
    }
    
    # Страница 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    
    # Для получения SSL сертификата (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        status_zone acme;
    }
}

